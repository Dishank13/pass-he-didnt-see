[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phds"
version = "0.1.0"
description = "The Pass He Didn't See: a mini TacticAI on StatsBomb 360 data"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "requests>=2.31",
  "shapely>=2.0",
  "matplotlib>=3.8",
  "mplsoccer>=1.2",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "torch>=2.2",  # CPU build: pip install torch --index-url https://download.pytorch.org/whl/cpu
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jupyter", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408"]  # dict(...) reads better for test fixtures

[tool.pytest.ini_options]
testpaths = ["tests"]
